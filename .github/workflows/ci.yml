name: DSP validation
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: node --check audio_filter.js
      - name: DSP numerical tests and worklet simulation
        run: node tests/validate.cjs
      - name: UI and DSP default synchronization
        run: node tests/validate-defaults.cjs
      - name: Receiver modulation detection
        run: node tests/validate-mode-detection.cjs
      - name: Audio noise reduction and listening presets
        run: node tests/validate-nr-presets.cjs
      - name: Studio 2.2 speech-aware NR regression
        run: node tests/validate-speech-nr.cjs
      - name: Studio 2.2 beta.2 SSB body and A/B
        run: node tests/validate-ssb-compare.cjs
      - name: RNNoise worklet and classical failback simulation
        run: node tests/validate-rnnoise.cjs
      - name: RNNoise pinned WebAssembly integration smoke
        run: bash tests/validate-rnnoise-bundle.sh
